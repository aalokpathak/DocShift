<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DocShift">
  <title>DocShift</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1E1B4B" flood-opacity=".35"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="256" rx="116" fill="url(#gloss)"/>

  <!-- back page -->
  <path d="M112 128h116l56 56v178a22 22 0 0 1-22 22H112a22 22 0 0 1-22-22V150a22 22 0 0 1 22-22z"
        fill="#FFFFFF" fill-opacity=".38"/>

  <!-- front page -->
  <g filter="url(#soft)">
    <path d="M176 100h122l64 64v206a24 24 0 0 1-24 24H176a24 24 0 0 1-24-24V124a24 24 0 0 1 24-24z" fill="#FFFFFF"/>
  </g>
  <path d="M298 100v40a24 24 0 0 0 24 24h40z" fill="#C7D2FE"/>
  <rect x="184" y="196" width="120" height="16" rx="8" fill="#6366F1"/>
  <rect x="184" y="230" width="150" height="14" rx="7" fill="#C7D2FE"/>
  <rect x="184" y="260" width="128" height="14" rx="7" fill="#C7D2FE"/>
  <rect x="184" y="290" width="88" height="14" rx="7" fill="#C7D2FE"/>

  <!-- convert badge -->
  <circle cx="356" cy="358" r="92" fill="#FFFFFF"/>
  <circle cx="356" cy="358" r="78" fill="url(#badge)"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <path d="M318 338h68"/>
    <path d="M368 320l18 18-18 18"/>
    <path d="M394 380h-68"/>
    <path d="M344 362l-18 18 18 18"/>
  </g>
</svg>
